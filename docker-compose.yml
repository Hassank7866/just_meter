services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: just_meter
      POSTGRES_USER: just_meter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-just-meter-local-demo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U just_meter -d just_meter"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:5005
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-local-demo-signing-secret-change-before-deployment}
      DATABASE_URL: postgresql+psycopg://just_meter:${POSTGRES_PASSWORD:-just-meter-local-demo}@db:5432/just_meter
      IMPORT_LEGACY_DATA: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
      VITE_MOBILE_SCANNER_URL: ${MOBILE_SCANNER_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mobile-tunnel:
    profiles: [mobile]
    image: node:20-alpine
    command: sh -c "npx --yes localtunnel --port 8000 --local-host backend"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    volumes:
      - whatsapp-auth:/app/auth_info
    restart: unless-stopped

volumes:
  whatsapp-auth:
  postgres-data:
